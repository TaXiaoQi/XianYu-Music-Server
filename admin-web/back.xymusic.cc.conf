server {
    server_name back.xymusic.cc;

    client_max_body_size 100m;

    # gzip 压缩：JS/CSS/JSON 传输体积缩小约 60-70%，显著加速移动端加载
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/xml+rss image/svg+xml application/wasm;

    # 静态资源：内容哈希文件名，可安全长期缓存（极大提升移动端加载速度）
    location /assets/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /logo.png {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML 与 SPA 深层路由、API：不做缓存，确保每次拿到最新构建
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/back.xymusic.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/back.xymusic.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = back.xymusic.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name back.xymusic.cc;
    return 404; # managed by Certbot


}